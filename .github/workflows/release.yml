name: release

# Builds the UI + jar, runs unit tests and publishes a GitHub release.
# Triggers: a v* tag push, manual dispatch, or a push to main that changes the VERSION file
# (version = contents of VERSION, notes = RELEASE_NOTES.md). An existing release is never overwritten.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (defaults to the VERSION file)
        default: ''
  push:
    tags: ['v*']
    branches: [main]
    paths: ['VERSION']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Unit tests (backend + frontend)
        run: |
          (cd backend && mvn -B test)
          (cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit && npx vitest run)

      - name: Build jar with embedded UI
        run: scripts/build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then V="${INPUT_VERSION}"
          else V="$(tr -d '[:space:]' < VERSION)"; fi
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
          git archive --format=zip -o "grafana-reporter-$V-source.zip" HEAD
          cp backend/target/grafana-reporter.jar "grafana-reporter-$V.jar"
          sed "s/VERSION/$V/g" RELEASE_NOTES.md > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Grafana Reporter $TAG" --notes-file notes.md \
            "grafana-reporter-$V.jar" "grafana-reporter-$V-source.zip"
