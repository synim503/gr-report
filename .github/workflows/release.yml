name: release

# Builds the UI + jar, runs unit tests and publishes a GitHub release.
# Runs on every push of a v* tag, on manual dispatch, and once for the first push of this file to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.0.0)
        default: '1.0.0'
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Unit tests (backend + frontend)
        run: |
          (cd backend && mvn -B test)
          (cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit && npx vitest run)

      - name: Build jar with embedded UI
        run: scripts/build.sh

      - name: Resolve version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          echo "version=${V:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.v.outputs.version }}"; TAG="v$V"
          git archive --format=zip -o "grafana-reporter-$V-source.zip" HEAD
          cp backend/target/grafana-reporter-1.0.0.jar "grafana-reporter-$V.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
          cat > notes.md <<'NOTES'
          Первый релиз.

          - Визуальный редактор макета страницы Word (React): drag & drop графиков Grafana, текста и изображений, привязка и выравнивание, несколько страниц, undo/redo.
          - Форматирование текста как в Word: шрифты, размеры, цвета, списки, заголовки, ссылки, переменные.
          - Блоки из нескольких графиков одного дашборда с переменными (`var-host=…`).
          - Подключение к Grafana по токену service account, токен вводится в интерфейсе.
          - Генерация `.docx` (Java 17, Spring Boot): текст — позиционированные рамки Word, графики — плавающие картинки.
          - Светлая и тёмная тема.

          Запуск: `java -jar grafana-reporter-VERSION.jar` → http://localhost:8080. Для картинок графиков в Grafana нужен `grafana-image-renderer`.
          NOTES
          sed -i "s/VERSION/$V/" notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Grafana Reporter $TAG" --notes-file notes.md \
            "grafana-reporter-$V.jar" "grafana-reporter-$V-source.zip"
